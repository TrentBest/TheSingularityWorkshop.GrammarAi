name: Sith Policy

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sith-policy-\${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate permanent branch policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: \${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Evaluate every repository branch and update the living badge
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
          DEFAULT_BRANCH: \${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p assets
          branch_file="$(mktemp)"
          trap 'rm -f "$branch_file"' EXIT
          status="UNVERIFIED"

          if gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > "$branch_file"; then
            mapfile -t branches < <(sort -u "$branch_file")
            branch_count="\${#branches[@]}"
            if [[ "$branch_count" -eq 2 &&
                  "\${branches[0]}" == "development" &&
                  "\${branches[1]}" == "master" ]]; then
              status="COMPLIANT"
            else
              status="NON-COMPLIANT"
            fi
          else
            branches=()
            branch_count="unknown"
          fi

          case "$status" in
            COMPLIANT)
              headline="THE FORCE IS IN BALANCE"
              detail="2 branches · master + development"
              accent="#36d399"
              glow="#36d399"
              ;;
            NON-COMPLIANT)
              headline="SITH POLICY BREACHED"
              detail="$branch_count branches · exactly 2 required"
              accent="#ff4d6d"
              glow="#ff1744"
              ;;
            *)
              headline="POLICY UNVERIFIED"
              detail="branch inventory unavailable"
              accent="#f5b942"
              glow="#f5b942"
              ;;
          esac

          evaluated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          branch_json="$(printf '%s\n' "\${branches[@]:-}" | jq -R 'select(length > 0)' | jq -s '.')"
          branch_count_json="$(if [[ "$branch_count" == "unknown" ]]; then echo null; else echo "$branch_count"; fi)"
          jq -n \
            --arg repository "$GH_REPO" \
            --arg status "$status" \
            --arg evaluated_at "$evaluated_at" \
            --arg workflow_run "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --argjson branch_count "$branch_count_json" \
            --argjson branches "$branch_json" \
            '{
              repository: $repository,
              policy: "exactly-master-and-development",
              required_branches: ["development", "master"],
              actual_branches: $branches,
              branch_count: $branch_count,
              status: $status,
              evaluated_at: $evaluated_at,
              workflow_run: $workflow_run,
              triggering_commit: $commit
            }' > assets/sith-policy.json

          cat > assets/sith-policy.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-labelledby="title desc">
            <title id="title">Sith Policy: $status</title>
            <desc id="desc">$headline. $detail.</desc>
            <defs>
              <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#252b3a"/>
                <stop offset="1" stop-color="#090d17"/>
              </linearGradient>
              <radialGradient id="core">
                <stop offset="0" stop-color="$glow" stop-opacity=".42"/>
                <stop offset="1" stop-color="$glow" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <style>
              .pulse { transform-origin: 52px 52px; animation: pulse 3s ease-in-out infinite; }
              .sweep { transform-origin: 52px 52px; animation: sweep 7s linear infinite; }
              @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
              @keyframes sweep { to { transform:rotate(360deg); } }
              @media (prefers-reduced-motion: reduce) { .pulse,.sweep { animation:none; } }
            </style>
            <rect x="1" y="1" width="438" height="102" rx="14" fill="url(#metal)" stroke="$accent" stroke-opacity=".75" stroke-width="1.5"/>
            <circle cx="52" cy="52" r="44" fill="url(#core)" class="pulse"/>
            <circle cx="52" cy="52" r="34" fill="none" stroke="$accent" stroke-width="1.5" stroke-dasharray="3 5" class="sweep" opacity=".8"/>
            <circle cx="52" cy="52" r="27" fill="#0b1020" stroke="$accent" stroke-width="2" filter="url(#glow)"/>
            <path d="M39 30 L65 74 M65 30 L39 74" stroke="$accent" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
            <path d="M52 36 L57 47 L69 52 L57 57 L52 69 L47 57 L35 52 L47 47 Z" fill="#f8fafc" opacity=".92"/>
            <text x="108" y="34" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE SINGULARITY WORKSHOP</text>
            <text x="108" y="57" fill="$accent" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1">$headline</text>
            <text x="108" y="78" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12">$detail</text>
            <text x="420" y="94" fill="#64748b" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="8">SITH POLICY · LIVE EVALUATION</text>
          </svg>
          SVG

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sith-policy.svg assets/sith-policy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Sith policy evidence"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

          {
            echo "## Sith Policy: $status"
            echo
            echo "- Required branches: \`master\`, \`development\`"
            echo "- Actual branch count: $branch_count"
            echo "- Actual branches:"
            if (("\${#branches[@]}" == 0)); then
              echo "  - unavailable"
            else
              for item in "\${branches[@]}"; do echo "  - \`$item\`"; done
            fi
            echo "- Evaluated: $evaluated_at"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" != "COMPLIANT" ]]; then
            echo "::error::Sith Policy requires exactly master and development; status is $status."
            exit 1
          fi
