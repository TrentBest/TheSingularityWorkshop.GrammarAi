<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">How a grammar becomes a structural contract</title>
<desc id="desc">An animated teaching diagram. A grammar starts at a nonterminal, offers alternative production rules, and each rule emits an ordered sequence of grammar symbols. GrammarAi checks its own structural invariants but leaves external protocol resolution and meaning to the host.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#20152f"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a5b4fc"/></marker>
  <style>
    text{font-family:Arial,sans-serif}.heading{font-size:34px;font-weight:700;fill:#f8fafc;letter-spacing:1px}.sub{font-size:17px;fill:#a5b4fc;letter-spacing:2px}.label{font-size:16px;fill:#94a3b8;letter-spacing:1.5px}.body{font-size:19px;fill:#e2e8f0}.mono{font-family:monospace;font-size:20px;fill:#f8fafc}.small{font-size:15px;fill:#cbd5e1}.panel{fill:#0d1728;stroke:#475569;stroke-width:2}.terminal{fill:#082b35;stroke:#22d3ee;stroke-width:2}.nonterminal{fill:#24183b;stroke:#a78bfa;stroke-width:2}.rule{fill:#151e32;stroke:#818cf8;stroke-width:2}.arrow{fill:none;stroke:#a5b4fc;stroke-width:3;marker-end:url(#arrow)}.pulse{animation:pulse 3.6s ease-in-out infinite}.stage2{animation:reveal2 7.2s ease-in-out infinite}.stage3{animation:reveal3 7.2s ease-in-out infinite}.stage4{animation:reveal4 7.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes reveal2{0%,20%{opacity:.35}30%,85%{opacity:1}100%{opacity:.35}}@keyframes reveal3{0%,40%{opacity:.3}50%,85%{opacity:1}100%{opacity:.3}}@keyframes reveal4{0%,60%{opacity:.3}70%,90%{opacity:1}100%{opacity:.3}}
  </style>
</defs>
<rect width="1200" height="1000" fill="url(#background)"/>
<text x="600" y="62" text-anchor="middle" class="heading">HOW A GRAMMAR BECOMES A CONTRACT</text>
<text x="600" y="96" text-anchor="middle" class="sub">FOLLOW THE STRUCTURE — NOT THE EXECUTION</text>

<rect x="70" y="135" width="1060" height="145" rx="22" class="panel"/>
<text x="105" y="172" class="label">1 · START SYMBOL</text>
<rect x="105" y="192" width="230" height="58" rx="14" class="nonterminal pulse"/>
<text x="220" y="228" text-anchor="middle" class="mono">[4001] Greeting</text>
<path d="M350 220 H450" class="arrow"/>
<text x="480" y="210" class="body">The start symbol is a grammar-owned</text>
<text x="480" y="238" class="body">nonterminal that must have a rule.</text>

<rect x="70" y="310" width="1060" height="270" rx="22" class="panel"/>
<text x="105" y="348" class="label">2 · ALTERNATIVE PRODUCTIONS</text>
<text x="105" y="380" class="small">Two rules with the same left side are alternatives — choose a rule, not both.</text>
<rect x="115" y="410" width="180" height="54" rx="12" class="rule"/>
<text x="205" y="443" text-anchor="middle" class="mono">rule [5001]</text>
<path d="M305 437 H365" class="arrow"/>
<rect x="380" y="410" width="300" height="54" rx="12" class="nonterminal"/>
<text x="530" y="443" text-anchor="middle" class="mono">[4001] → [1001:2001]</text>
<rect x="115" y="485" width="180" height="54" rx="12" class="rule stage2"/>
<text x="205" y="518" text-anchor="middle" class="mono">rule [5002]</text>
<path d="M305 512 H365" class="arrow stage2"/>
<rect x="380" y="485" width="300" height="54" rx="12" class="nonterminal stage2"/>
<text x="530" y="518" text-anchor="middle" class="mono">[4001] → [1001:2002]</text>
<path d="M715 437 H770" class="arrow"/>
<path d="M715 512 H770" class="arrow stage2"/>
<rect x="790" y="410" width="285" height="129" rx="16" class="terminal"/>
<text x="932" y="447" text-anchor="middle" class="label">EXTERNAL TERMINALS</text>
<text x="932" y="480" text-anchor="middle" class="mono">[1001:2001]</text>
<text x="932" y="512" text-anchor="middle" class="mono">[1001:2002]</text>

<rect x="70" y="610" width="1060" height="160" rx="22" class="panel"/>
<text x="105" y="648" class="label">3 · ORDERED SEQUENCE WITHIN ONE RULE</text>
<rect x="110" y="680" width="185" height="54" rx="12" class="rule"/>
<text x="202" y="713" text-anchor="middle" class="mono">[4002] Person</text>
<path d="M305 707 H355" class="arrow"/>
<rect x="370" y="680" width="205" height="54" rx="12" class="terminal"/>
<text x="472" y="713" text-anchor="middle" class="mono">[1001:2001]</text>
<path d="M585 707 H625" class="arrow"/>
<rect x="640" y="680" width="205" height="54" rx="12" class="terminal"/>
<text x="742" y="713" text-anchor="middle" class="mono">[1002:3001]</text>
<path d="M855 707 H895" class="arrow"/>
<text x="920" y="700" class="small">Order matters:</text>
<text x="920" y="725" class="small">first symbol, then second.</text>

<rect x="70" y="800" width="1060" height="140" rx="22" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
<text x="105" y="838" class="label">4 · WHAT BUILD CAN AND CANNOT ESTABLISH</text>
<g class="stage3">
<text x="110" y="875" class="body">✓ Unique rule IDs; valid nonzero IDs</text>
<text x="110" y="906" class="body">✓ Start symbol and referenced nonterminals have productions</text>
</g>
<g class="stage4">
<text x="665" y="875" class="body">✕ Does not load external protocol definitions</text>
<text x="665" y="906" class="body">✕ Does not parse model output or authorize actions</text>
</g>
<text x="600" y="975" text-anchor="middle" class="small">GrammarAI describes structure. The host resolves meaning, applies policy, and decides what happens.</text>
</svg>